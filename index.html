<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <main class="container">

        <header>

            <nav class="navbar">

                <div class="navbar__logo">
                    <img src="/icon.svg" alt="Haven logo">

                </div>

                <ul class="navbar__list">
                    <li><a href="#">Home</a></li>
                    <li><a href="#">Usecases</a></li>
                    <li><a href="#">Pricing</a></li>
                    <li><a href="#">Careers</a></li>

            <!-- HERO -->

                <span class="message">

                <h1>
                    Design with ease.
                </h1>

                <div class="text">
                    <p>Design smarter with AI that understands you.</p>

                <div class="cta">

                    <a href="#" class="start">
                        Get Started <span>→</span>
